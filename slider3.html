<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Slider</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
}

.hero-slider{
    max-width:1100px;
    margin:50px auto;
}

.carousel-item{
    height:560px;
}

.carousel-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.carousel-caption{
    top:50%;
    bottom:auto;
    transform:translateY(-50%);
}

.carousel-caption h1{
    font-size:70px;
    font-weight:600;
}

.carousel-caption p{
    font-size:20px;
}

.carousel-control-prev-icon,
.carousel-control-next-icon{
    width:55px;
    height:55px;
}

.carousel-indicators [data-bs-target]{
    width:40px;
    height:4px;
    border-radius:20px;
    margin:0 5px;
}

@media(max-width:768px){

.carousel-item{
    height:350px;
}

.carousel-caption h1{
    font-size:40px;
}

.carousel-caption p{
    font-size:16px;
}

}
</style>

</head>
<body>

<div class="container">

<div id="heroSlider" class="carousel slide hero-slider" data-bs-ride="carousel" data-bs-interval="5000">

<!-- Indicators -->

<div class="carousel-indicators">
<button type="button" data-bs-target="#heroSlider" data-bs-slide-to="0" class="active"></button>
<button type="button" data-bs-target="#heroSlider" data-bs-slide-to="1"></button>
<button type="button" data-bs-target="#heroSlider" data-bs-slide-to="2"></button>
</div>

<!-- Slides -->

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://picsum.photos/id/1015/1400/800" alt="">
<div class="carousel-caption">
<h1>First Slide</h1>
<p>Bootstrap Carousel Example</p>
</div>
</div>

<div class="carousel-item">
<img src="https://picsum.photos/id/1016/1400/800" alt="">
<div class="carousel-caption">
<h1>Second Slide</h1>
<p>Responsive Bootstrap 5 Slider</p>
</div>
</div>

<div class="carousel-item">
<img src="https://picsum.photos/id/1018/1400/800" alt="">
<div class="carousel-caption">
<h1>Third Slide</h1>
<p>Easy to Customize</p>
</div>
</div>

</div>

<!-- Prev -->

<button class="carousel-control-prev" type="button" data-bs-target="#heroSlider" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<!-- Next -->

<button class="carousel-control-next" type="button" data-bs-target="#heroSlider" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
